# Build Proton Wine for Android (bionic), ARM64X (hybrid ARM64EC + ARM64).
#
# ARM64X = configure --enable-archs=arm64ec,aarch64 (no i386/wow64):
# winebuild/winegcc produce hybrid ARM64X PE modules that work for both
# native ARM64 Windows apps and x86-64-emulated (FEX) apps.
#
# Same single SDK 28 target with 16KB page size support as the x86_64 /
# arm64ec workflow. Manual trigger only, so it never clashes with the
# main workflow's date-tagged release.
#
# Parts of this workflow (ccache caching, zstd .wcp packaging, profile.json
# generation, toolchain/termuxfs setup) are adopted from The412Banner/proton-wine
# (https://github.com/The412Banner/proton-wine, release build-p11-20260821).
name: Build Proton Wine (ARM64X, SDK 28, 16KB pages)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            zstd \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for aarch64
        run: |
          mkdir -p $HOME/termuxfs/aarch64
          cd $HOME/termuxfs/aarch64
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar
          ls -la $HOME/termuxfs/aarch64/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Check out ntsync-android (userspace ntsync)
        uses: actions/checkout@v4
        with:
          repository: GameNative/ntsync-android
          path: ntsync-android

      - name: Set up Rust for ntsync-android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ccache — caches compiled objects across runs (rolling restore-keys).
      # The build scripts wrap clang/clang++ in ccache automatically when it is on PATH.
      - name: Cache ccache (arm64x)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-arm64x-${{ github.sha }}
          restore-keys: |
            ccache-p11-arm64x-

      - name: Run autogen.sh
        run: bash autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh

      - name: Build sysvshm library
        run: |
          bash build-scripts/build-step-arm64x.sh --build-sysvshm

      - name: Build ntsync-android library
        env:
          NTSYNC_ANDROID_DIR: ${{ github.workspace }}/ntsync-android
        run: |
          bash build-scripts/build-step-arm64x.sh --build-ntsync-android

      - name: Configure build (ARM64X)
        run: |
          bash build-scripts/build-step-arm64x.sh --configure

      - name: Build Proton (ARM64X)
        run: |
          bash build-scripts/build-step-arm64x.sh --build

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Install Proton (ARM64X)
        run: |
          bash build-scripts/build-step-arm64x.sh --install

      # No arm64x-specific prefix pack exists yet; the arm64ec pack is the
      # closest match (same aarch64 unix side + ARM64X/ARM64EC PE side).
      - name: Download prefixPack.txz
        run: |
          wget https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json files
        run: |
          # Generate Proton profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Proton",
            "versionName": "11.0-2-arm64x",
            "versionCode": 1,
            "description": "Proton 11.0-2 arm64x (bionic) — hybrid ARM64X (ARM64EC+ARM64) PE, no x86 wow64. stock Valve + runtime ntsync (kernel driver, userspace fallback) + fsync + Android fixes. SDK 28 + 16KB pages. Needs a fresh arm64ec container.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "11.0-2-arm64x",
            "versionCode": 0,
            "description": "Proton 11.0-2 arm64x (bionic) — hybrid ARM64X (ARM64EC+ARM64) PE, no x86 wow64. stock Valve + runtime ntsync (kernel driver, userspace fallback) + fsync + Android fixes. SDK 28 + 16KB pages. Needs a fresh arm64ec container.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

      - name: Package build artifacts
        run: |
          OUTPUT_DIR="$HOME/compiled-files-arm64x"
          ARCH_NAME="arm64x"

          cd $OUTPUT_DIR

          # Create Proton WCP - zstd (tar.zst) for fast in-app install; adopted from
          # The412Banner/proton-wine. The app's ContentsManager tries XZ then falls back
          # to ZSTD, so a zstd .wcp installs with no app change and decompresses far
          # faster than xz. -T0 = all cores, -19 = high ratio (small download).
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf proton-11.0-2-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv proton-11.0-2-$ARCH_NAME.wcp $GITHUB_WORKSPACE/

          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf proton-wine-11.0-2-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv proton-wine-11.0-2-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/

      - name: Upload Proton build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-arm64x
          path: proton-11.0-2-arm64x.wcp
          retention-days: 30

      - name: Upload Wine build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-wine-arm64x
          path: proton-wine-11.0-2-arm64x.wcp.xz
          retention-days: 30
